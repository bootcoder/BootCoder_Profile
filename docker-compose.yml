services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/log/bootcore/nginx:/var/log/nginx
    restart: unless-stopped
  web:
    build: .
    command: bash -lc "rm -f tmp/pids/server.pid && bundle exec puma -C config/puma.rb"
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # <-- maps to the EC2 host from inside container
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      PORT: "3000"
      RDS_HOST: host.docker.internal

    # In production, avoid bind-mounting the whole app (uses disk, breaks immutability)
    # Remove this line unless you truly need live code edits on the server:
    # volumes:
    #   - .:/app
    # logging:
    #   driver: local
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
    volumes:
      - /var/log/bootcore/rails:/app/log
