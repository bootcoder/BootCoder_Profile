
default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5

development:
  <<: *default
  database: bootcore_development

test:
  <<: *default
  database: bootcore_test

production:
  <<: *default
  database: <%= ENV.fetch("RDS_NAME", 'bootcore_prod') %>
  host: <%= ENV["RDS_HOST"] %>
  password: <%= ENV["RDS_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  port: <%= ENV.fetch("RDS_PORT", 5432) %>
  sslmode: <%= ENV.fetch("RDS_SSLMODE", "require") %>
  username: <%= ENV["RDS_USERNAME"] %>
