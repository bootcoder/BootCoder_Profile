# local ./nginx/nginx.conf
# /etc/nginx/nginx.conf

load_module /etc/nginx/modules/ngx_http_geoip2_module.so;

worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Trust only CloudFront edges (auto-generated file)
  include /etc/nginx/runtime/cloudfront_realip.conf;


  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # GEOIP2 LOOKUP (MaxMind GeoLite2 / GeoIP2 City DB)
  # DB SRC: https://github.com/sapics/ip-location-db/tree/main/geolite2-city-mmdb


  # IPv4 DB
  geoip2 /etc/nginx/geoip/geolite2-city-ipv4.mmdb {
    $geo_city_v4        source=$remote_addr city;
    $geo_region_v4      source=$remote_addr state1;
    $geo_country_iso_v4 source=$remote_addr country_code;
    $geo_tz_v4          source=$remote_addr timezone;
  }

  # IPv6 DB
  geoip2 /etc/nginx/geoip/geolite2-city-ipv6.mmdb {
    $geo_city_v6        source=$remote_addr city;
    $geo_region_v6      source=$remote_addr state1;
    $geo_country_iso_v6 source=$remote_addr country_code;
    $geo_tz_v6          source=$remote_addr timezone;
  }

  # Choose v4 vs v6 based on whether remote_addr contains ":" (IPv6)
  map $remote_addr $geo_city        { default $geo_city_v4;        "~:" $geo_city_v6; }
  map $remote_addr $geo_region      { default $geo_region_v4;      "~:" $geo_region_v6; }
  map $remote_addr $geo_country_iso { default $geo_country_iso_v4; "~:" $geo_country_iso_v6; }
  map $remote_addr $geo_timezone    { default $geo_tz_v4;          "~:" $geo_tz_v6; }


  # Build a single string for "Tampa, Florida" (or empty if unknown)
  map "$geo_city|$geo_region" $geo_location {
    default "$geo_city, $geo_region";
    "~^\|.*$" "";
    "~^.*\|$" "";
  }

  #
  # 3) PROXY HEADERS TO RAILS
  #
  # Important: after real_ip, $remote_addr is now the real client IP.
  # Keep forwarding chain too.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP       $remote_addr;

  #
  # 4) JSON ACCESS LOG (add geo fields)
  #
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"host":"$host",'
      '"request":"$request",'
      '"uri":"$uri",'
      '"status":"$status",'
      '"bytes_sent":"$bytes_sent",'
      '"request_time":"$request_time",'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"request_id":"$request_id",'
      '"location":"$geo_location",'
      '"city":"$geo_city",'
      '"region":"$geo_region",'
      '"country_iso":"$geo_country_iso",'
      '"timezone":"$geo_timezone"'
    '}';

  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;

  upstream rails_upstream {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    location ~* (\.php|wp-) {
      default_type application/json;
      return 444 '{"status":"no_response","message":"Hackers kindly choke on a clown car full of cow creme (Bull variety should match your lifestyle)"}';
    }

    add_header X-Debug-Geo "$geo_city|$geo_region|$geo_country_iso" always;

    location / {
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Request-Id      $request_id;

      proxy_pass http://rails_upstream;
    }
  }
}
