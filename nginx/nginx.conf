# /etc/nginx/nginx.conf
worker_processes auto;

events { worker_connections 1024; }

# If you installed geoip2 as a dynamic module, you may need this line (path varies by distro):
# load_module modules/ngx_http_geoip2_module.so;

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  #
  # 1) REAL CLIENT IP (so geo + logs use the user's IP, not CloudFront/ALB)
  #
  # Trust ONLY your own proxies. For most AWS setups this is "private IP space" (ALB/NLB inside VPC)
  # plus localhost. Do NOT use 0.0.0.0/0 or users can spoof X-Forwarded-For.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  # If you're *directly* behind CloudFront to this NGINX (no ALB), you have two options:
  # - Keep trusting only private ranges (safe) and rely on your edge to connect via private networking
  # - OR explicitly trust CloudFront IP ranges (more work; they change over time)
  #   (You'd generate many set_real_ip_from lines from AWS' published ip-ranges.json)
  #
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  #
  # 2) GEOIP2 LOOKUP (MaxMind GeoLite2 / GeoIP2 City DB)
  # DB SRC: https://github.com/sapics/ip-location-db/tree/main/geolite2-city-mmdb
  #
  # Put the DB somewhere readable by nginx, e.g.:
  #   /etc/nginx/GeoLite2-City.mmdb
  #
  geoip2 ./nginx/geolite2-city-ipv4.mmdb {
    $geo_city        city names en;
    $geo_region      subdivisions 0 names en;
    $geo_country     country names en;
    $geo_country_iso country iso_code;
  }

  # Build a single string for "Tampa, Florida" (or empty if unknown)
  map "$geo_city|$geo_region" $geo_location {
    default "$geo_city, $geo_region";
    "~^\|.*$" "";   # no city
    "~^.*\|$" "";   # no region
  }

  #
  # 3) PROXY HEADERS TO RAILS
  #
  # Important: after real_ip, $remote_addr is now the real client IP.
  # Keep forwarding chain too.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP       $remote_addr;

  #
  # 4) JSON ACCESS LOG (add geo fields)
  #
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"host":"$host",'
      '"request":"$request",'
      '"uri":"$uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"request_id":"$request_id",'
      '"location":"$geo_location",'
      '"city":"$geo_city",'
      '"region":"$geo_region",'
      '"country":"$geo_country",'
      '"country_iso":"$geo_country_iso"'
    '}';

  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;

  upstream rails_upstream {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Request-Id      $request_id;

      proxy_pass http://rails_upstream;
    }
  }
}
